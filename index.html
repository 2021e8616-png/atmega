<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATmega Control</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        h1 {
            margin-bottom: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ATmega CONTROL</h1>

    <div class="box">
        <h2>⚙️ 모터 제어</h2>

        <button onclick="motorOn()">ON</button>
        <button onclick="motorOff()">OFF</button>

        <div class="status">
            모터 상태: <span id="motorStatus">OFF</span>
        </div>
    </div>


    <div class="box">
        <h2>📡 센서 제어</h2>

        <button onclick="sensorOn()">ON</button>
        <button onclick="sensorOff()">OFF</button>

        <div class="status">
            센서 상태: <span id="sensorStatus">OFF</span>
        </div>
    </div>

</div>


<script>

function motorOn() {
    document.getElementById("motorStatus").innerText = "ON";
}

function motorOff() {
    document.getElementById("motorStatus").innerText = "OFF";
}

function sensorOn() {
    document.getElementById("sensorStatus").innerText = "ON";
}

function sensorOff() {
    document.getElementById("sensorStatus").innerText = "OFF";
}

</script>

</body>
</html>
